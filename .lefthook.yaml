# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/refs/heads/master/schema.json
output: [summary]
templates:
  run: run --as-is --quiet --no-progress
no_auto_install: true
pre-commit:
  fail_on_changes: always
  exclude:
    - .copier-answers.yml
  jobs:
    - name: pixi-install
      run: pixi install -e default -e docs --quiet --no-progress
    # Biome may rewrite frontend files, so run it before parallel checks such as ESLint.
    - name: biome
      glob: "frontend/**"
      run: pixi {run} frontend-format
    - group:
        parallel: true
        jobs:
          - name: docformatter
            glob: "*.{py,pyi}"
            run: pixi {run} docformatter -i {staged_files}
          - name: ruff-check
            glob: "*.{py,pyi}"
            run: pixi {run} ruff check --fix --exit-non-zero-on-fix --force-exclude
          - name: ruff-format
            glob: "*.{py,pyi}"
            run: pixi {run} ruff format --force-exclude
          - name: pyrefly
            glob: "*.{py,pyi}"
            run: pixi {run} pyrefly check {staged_files}
          - name: prettier
            glob: "*.{css,js,json,jsx,md,mdx,ts,tsx,yml,yaml}"
            run: pixi {run} prettier --write --no-error-on-unmatched-pattern --list-different --ignore-unknown {staged_files}
            env:
              CI: "1"
          - name: eslint
            glob: "frontend/**"
            run: pixi {run} frontend-lint
          - name: taplo
            glob: "*.toml"
            run: pixi {run} taplo format {staged_files}
          - name: trailing-whitespace-fixer
            glob: "*"
            file_types: text
            run: pixi {run} trailing-whitespace-fixer {staged_files}
          - name: end-of-file-fixer
            glob: "*"
            file_types: text
            run: pixi {run} end-of-file-fixer {staged_files}
          - name: check-merge-conflict
            glob: "*"
            file_types: text
            run: pixi {run} check-merge-conflict --assume-in-merge {staged_files}
          - name: typos
            glob: "*"
            file_types: text
            run: pixi {run} typos --force-exclude {staged_files}
          - name: zizmor
            glob: "*.{yml,yaml}"
            run: pixi {run} zizmor --no-progress --min-severity high --fix --offline .
          - name: docs-check
            glob: "{docs/**,quant_ranger/**/*.py,pixi.toml,pixi.lock,pyproject.toml}"
            run: pixi {run} -e docs docs-check
