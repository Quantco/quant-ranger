[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-ranger"
description = "Tool for maintenance work across GitHub repositories."
authors = [{ name = "QuantCo, Inc.", email = "noreply@quantco.com" }]
# replaced in CI
version = "0.0.0"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.14"
readme = "README.md"

# if making changes, also do them in https://github.com/conda-forge/quant-ranger-feedstock
dependencies = [
  "copier>=9.8.0,<10",
  "packaging>=26.2",
  "pixi-diff-to-markdown>=0.3.3,<0.4.0",
  "pydantic>=2.13.4,<3",
  "PyGithub>=2.9.1,<3",
  "pyyaml>=6.0.3,<7",
  "requests>=2.34.2,<3",
  "rich>=15.0.0,<16",
  # necessary for TOML 1.1
  "tomlkit>=0.15.0,<0.16.0",
  "typer>=0.25.1,<0.26",
  "urllib3>=2.7.0,<3",
  "zizmor==1.22.0",
]

[project.urls]
repository = "https://github.com/quantco/quant-ranger"

[tool.hatch.build.targets.wheel]
packages = ["quant_ranger"]

[project.scripts]
quant-ranger = "quant_ranger.cli:main"

[tool.docformatter]
black = true # only sets the style options to the default values of black

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = [
  "N803", # https://docs.astral.sh/ruff/rules/invalid-argument-name
  "N806", # https://docs.astral.sh/ruff/rules/non-lowercase-variable-in-function
  "E501", # https://docs.astral.sh/ruff/faq/#is-the-ruff-linter-compatible-with-black
]
select = [
  # pyflakes
  "F",
  # pycodestyle
  "E",
  "W",
  # isort
  "I",
  # pep8-naming
  "N",
  # pyupgrade
  "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
python-version = "3.14.0"
preset = "strict"
[tool.pyrefly.errors]
# https://github.com/Quantco/quant-ranger/issues/17
implicit-any-lambda = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real_pixi_info: do not stub out `pixi info` in the pixi update tests",
]

[tool.typos]
# Taken from:
# https://github.com/crate-ci/typos/blob/master/docs/reference.md#example-configurations
default.extend-ignore-re = [
  # Disable spell-checking for an individual line.
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
  # Disable spell-checking for a code block.
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
]

[tool.pyright]
venv = "default"
venvPath = ".pixi/envs/"
